name: Auto Deploy

on:
  schedule:
    # Trigger every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not configured; skipping deploy trigger."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK_URL"
