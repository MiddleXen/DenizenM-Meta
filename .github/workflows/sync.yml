name: Auto Deploy

on:
  schedule:
    # Trigger every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK || 'https://api.vercel.com/v1/integrations/deploy/prj_dr0a9P75pnoQccjTQgjAMlj31QjZ/Xehq0KepWK' }}
        run: |
          curl -fsSL -X POST "$HOOK_URL"
